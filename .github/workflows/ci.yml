name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compileall
        run: python -m compileall -q kali_mind
      - name: Ruff
        run: |
          pip install ruff
          ruff check kali_mind tests
      - name: Pytest
        run: pytest -q --tb=short tests/
